# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/refs/heads/main/data/flatpak-manifest.schema.json
app-id: com.hopdeck.HopDeck
runtime: org.gnome.Platform
runtime-version: "48"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm20
command: /app/bin/hopdeck
build-options:
  append-path: "/usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin"
  prepend-ld-library-path: "/usr/lib/sdk/llvm20/lib"
  build-args:
    - "--share=network"
  env:
    # Sparse registry shaves multiple minutes off the cold dep
    # fetch — see https://blog.rust-lang.org/inside-rust/2023/01/30/cargo-sparse-protocol.html
    "CARGO_REGISTRIES_CRATES_IO_PROTOCOL": "sparse"
    "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER": "clang"
    # `-Wl,-z,now` forces immediate symbol resolution at load so
    # full-RELRO actually applies; combined with mold for link speed.
    "CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS": "-C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold -C link-arg=-Wl,-z,now"
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER": "clang"
    "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUSTFLAGS": "-C link-arg=-fuse-ld=/usr/lib/sdk/rust-stable/bin/mold -C link-arg=-Wl,-z,now"

finish-args:
  - "--socket=wayland"
  - "--socket=fallback-x11"
  - "--device=dri"
  - "--socket=session-bus"
  - "--share=network"
  # hopdeck relays UDP traffic; --share=ipc is required alongside
  # fallback-x11 (XSHM uses the shared IPC namespace).
  - "--share=ipc"
  # Per-app scope so a sandbox escape can't read every other app's
  # config; hopdeck's config dir is `$XDG_CONFIG_HOME/hopdeck/`
  # (see apps/hopdeck/src/config.rs).
  - "--filesystem=xdg-config/hopdeck:rw"
  # Software KVM relays clipboard across peers — needs the
  # Clipboard portal to read/write the host's selection.
  - "--talk-name=org.freedesktop.portal.Clipboard"
  # Connection / disconnection toasts use the Notifications
  # portal; without this, peer-status notifications are silently
  # swallowed by the sandbox.
  - "--talk-name=org.freedesktop.Notifications"
  - "--env=RUST_BACKTRACE=1"
  - "--env=RUST_LOG=hopdeck=debug"

modules:
  - name: hopdeck
    buildsystem: simple
    build-options:
      build-args:
        - "--share=network"
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm20/bin
      env:
        CARGO_HOME: /run/build/hopdeck/cargo
    build-commands:
      - cargo fetch --manifest-path Cargo.toml --verbose
      # The console is excluded from the workspace default-members
      # (gpui ashpd `async-io` vs. daemon ashpd `tokio`), so build it
      # explicitly.
      - cargo build --release
      - cargo build --release -p hopdeck-console
      - install -Dm0755 target/release/hopdeck /app/bin/hopdeck
      - install -Dm0755 target/release/hopdeck-console /app/bin/hopdeck-console
      - install -Dm0644 apps/hopdeck/assets/hopdeck.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # Render a hicolor PNG ladder from the source SVG so hosts
       # that prefer fixed-size raster icons (older toolkits, certain
       # KDE variants) get a sharp render without scaling the SVG at
       # runtime. rsvg-convert ships with the GNOME runtime.
      - |
        for size in 16 22 24 32 48 64 128 256 512; do
          install -d ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps
          rsvg-convert -w $size -h $size \
            apps/hopdeck/assets/hopdeck.svg \
            -o ${FLATPAK_DEST}/share/icons/hicolor/${size}x${size}/apps/${FLATPAK_ID}.png
        done
      # The source entry uses the simple `hopdeck` name; Flatpak requires
      # the desktop file and icon to carry the reverse-DNS app id.
      - |
        sed "s/^Icon=hopdeck$/Icon=${FLATPAK_ID}/" apps/hopdeck/hopdeck.desktop > /tmp/hopdeck.desktop
        install -Dm0644 /tmp/hopdeck.desktop ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      # AppStream metainfo — required by Flathub, also picked up by
      # GNOME Software / KDE Discover for sideloaded bundles.
      - |
        sed -e "s|<icon type=\"stock\">hopdeck</icon>|<icon type=\"stock\">${FLATPAK_ID}</icon>|" \
            -e "s|<launchable type=\"desktop-id\">hopdeck.desktop</launchable>|<launchable type=\"desktop-id\">${FLATPAK_ID}.desktop</launchable>|" \
            build-aux/com.hopdeck.HopDeck.metainfo.xml > /tmp/hopdeck.metainfo.xml
        install -Dm0644 /tmp/hopdeck.metainfo.xml ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ..
