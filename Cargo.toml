[workspace]
resolver = "2"
members = [
    "apps/hopdeck",
    "apps/hopdeck-console",
    "crates/hopdeck-cli",
    "crates/hopdeck-gtk",
    "crates/hopdeck-input-capture",
    "crates/hopdeck-input-emulation",
    "crates/hopdeck-input-event",
    "crates/hopdeck-ipc",
    "crates/hopdeck-proto",
    "crates/hopdeck-video",
]

[workspace.package]
version = "0.17.1"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/re2zero/hopdeck"

[workspace.dependencies]
input-event = { package = "hopdeck-input-event", path = "crates/hopdeck-input-event", version = "0.17.1" }
input-capture = { package = "hopdeck-input-capture", path = "crates/hopdeck-input-capture", version = "0.17.1" }
input-emulation = { package = "hopdeck-input-emulation", path = "crates/hopdeck-input-emulation", version = "0.17.1" }
hopdeck-proto = { path = "crates/hopdeck-proto", version = "0.17.1" }
hopdeck-video = { path = "crates/hopdeck-video", version = "0.17.1" }
hopdeck-ipc = { path = "crates/hopdeck-ipc", version = "0.17.1" }
hopdeck-cli = { path = "crates/hopdeck-cli", version = "0.17.1" }
hopdeck-gtk = { path = "crates/hopdeck-gtk", version = "0.17.1" }

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"
