name: "Release"
run-name: "Release - ${{ github.event.release.tag_name || inputs.tag }}"

# release-plz creates the GitHub Release; this workflow then builds the
# platform binaries + Flatpak bundle and attaches them to it.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build binaries for'
        required: true

env:
  CARGO_TERM_COLOR: always

# Each build job attaches its own asset to the Release directly via
# `gh release upload --clobber` (idempotent on re-run). This replaces a
# trailing job that round-tripped every artifact through actions/
# upload-artifact + download-artifact — a flaky platform now fails on
# its own without blocking the others' uploads.
permissions:
  contents: write

jobs:
  linux-release-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev libdbus-1-dev
        sudo apt-get install libwayland-dev libxkbcommon-dev
    - uses: Swatinem/rust-cache@v2
    - name: Release Build
      # Two invocations: gpui's ashpd `async-io` and the daemon's ashpd
      # `tokio` abort when feature-unified in one build graph.
      run: |
        cargo build --release
        cargo build --release -p hopdeck-console
    - name: Stage tarball contents
      # Bundles both binaries (daemon/CLI + GPUI console) with the
      # desktop file, app icon, LICENSE, and NOTICE so the hopdeck-bin
      # AUR PKGBUILD (and other distro packagers) can install everything
      # from one tarball.
      run: |
        TAG="${{ github.event.release.tag_name || inputs.tag }}"
        ver="${TAG#v}"
        stage="hopdeck-${ver}-x86_64"
        mkdir "$stage"
        cp target/release/hopdeck \
           target/release/hopdeck-console \
           apps/hopdeck/hopdeck.desktop \
           apps/hopdeck/assets/hopdeck.svg \
           LICENSE NOTICE \
           "$stage/"
        tar -czf "${stage}.tar.gz" "$stage"
    - name: Attach tarball to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: gh release upload "$TAG" hopdeck-*-x86_64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  linux-arm64-release-build:
    runs-on: ubuntu-22.04-arm
    steps:
    - uses: actions/checkout@v6
    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libx11-dev libxtst-dev libdbus-1-dev
        sudo apt-get install libwayland-dev libxkbcommon-dev
    - uses: Swatinem/rust-cache@v2
    - name: Release Build
      # Two invocations: gpui's ashpd `async-io` and the daemon's ashpd
      # `tokio` abort when feature-unified in one build graph.
      run: |
        cargo build --release
        cargo build --release -p hopdeck-console
    - name: Stage tarball contents
      run: |
        TAG="${{ github.event.release.tag_name || inputs.tag }}"
        ver="${TAG#v}"
        stage="hopdeck-${ver}-aarch64"
        mkdir "$stage"
        cp target/release/hopdeck \
           target/release/hopdeck-console \
           apps/hopdeck/hopdeck.desktop \
           apps/hopdeck/assets/hopdeck.svg \
           LICENSE NOTICE \
           "$stage/"
        tar -czf "${stage}.tar.gz" "$stage"
    - name: Attach tarball to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: gh release upload "$TAG" hopdeck-*-aarch64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"

  windows-release-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
    - uses: Swatinem/rust-cache@v2
    - name: Release Build
      # Two invocations: gpui's ashpd `async-io` and the daemon's ashpd
      # `tokio` abort when feature-unified in one build graph.
      run: |
        cargo build --release
        cargo build --release -p hopdeck-console
    - name: Create Archive
      # GPUI links no C runtime beyond the system DLLs, so the zip is
      # just the two executables (hopdeck launches hopdeck-console).
      run: |
        mkdir "hopdeck-windows"
        Copy-Item -Path "target\release\hopdeck.exe" -Destination "hopdeck-windows"
        Copy-Item -Path "target\release\hopdeck-console.exe" -Destination "hopdeck-windows"
        Compress-Archive -Path "hopdeck-windows\*" -DestinationPath hopdeck-windows-x86_64.zip
    - name: Attach archive to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: gh release upload "$env:TAG" hopdeck-windows-x86_64.zip --clobber --repo "$env:GITHUB_REPOSITORY"

  macos-release-build:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v6
    - name: Cache Homebrew downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: brew-${{ runner.arch }}-${{ hashFiles('.github/workflows/release.yml') }}
        restore-keys: brew-${{ runner.arch }}-
    - name: install dependencies
      run: |
        brew install imagemagick librsvg create-dmg
    - name: Scope rust-cache to the runner image
      # See ci.yml: keys the cache to the runner image so a Homebrew
      # bump can't leave stale `-L .../Cellar/<lib>/<ver>` paths in
      # cached build-script output.
      shell: bash
      run: echo "CACHE_IMAGE=${ImageOS:-}-${ImageVersion:-}" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ env.CACHE_IMAGE }}
    - name: Release Build
      run: |
        cargo build --release
        cargo build --release -p hopdeck-console
        cp target/release/hopdeck hopdeck-macos-intel
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      # Must run from apps/hopdeck/ so cargo-bundle's icon glob resolves
      # against the manifest dir. The console binary is copied in
      # alongside `hopdeck`, which launches it on no-argument startup.
      run: |
        (cd apps/hopdeck && cargo bundle --release)
        cp target/release/hopdeck-console \
           "target/release/bundle/osx/HopDeck.app/Contents/MacOS/"
    - name: Sign, notarize & package DMG
      env:
        # sign-and-notarize.sh consumes these; it no-ops to ad-hoc
        # signing when MACOS_CERTIFICATE_P12_BASE64 is unset, so the
        # build still succeeds without the secrets configured.
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
        MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        HOPDECK_SIGNING_PASSWORD: ${{ secrets.HOPDECK_SIGNING_PASSWORD }}
      run: |
        app="target/release/bundle/osx/HopDeck.app"
        dmg="target/release/bundle/osx/hopdeck-macos-intel.dmg"
        scripts/sign-and-notarize.sh --app "$app"
        create-dmg \
          --volname "HopDeck" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 96 \
          --icon "HopDeck.app" 150 200 \
          --app-drop-link 450 200 \
          --no-internet-enable \
          "$dmg" "$app"
        scripts/sign-and-notarize.sh --dmg "$dmg"
    - name: Attach DMG to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: gh release upload "$TAG" target/release/bundle/osx/hopdeck-macos-intel.dmg --clobber --repo "$GITHUB_REPOSITORY"

  macos-arm64-release-build:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
    - name: Cache Homebrew downloads
      uses: actions/cache@v4
      with:
        path: ~/Library/Caches/Homebrew/downloads
        key: brew-${{ runner.arch }}-${{ hashFiles('.github/workflows/release.yml') }}
        restore-keys: brew-${{ runner.arch }}-
    - name: install dependencies
      run: |
        brew install imagemagick librsvg create-dmg
    - name: Scope rust-cache to the runner image
      # See ci.yml: keys the cache to the runner image so a Homebrew
      # bump can't leave stale `-L .../Cellar/<lib>/<ver>` paths in
      # cached build-script output.
      shell: bash
      run: echo "CACHE_IMAGE=${ImageOS:-}-${ImageVersion:-}" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ env.CACHE_IMAGE }}
    - name: Release Build
      run: |
        cargo build --release
        cargo build --release -p hopdeck-console
        cp target/release/hopdeck hopdeck-macos-arm64
    - name: Make icns
      run: scripts/makeicns.sh
    - name: Install cargo bundle
      run: cargo install cargo-bundle
    - name: Bundle
      # Must run from apps/hopdeck/ so cargo-bundle's icon glob resolves
      # against the manifest dir. The console binary is copied in
      # alongside `hopdeck`, which launches it on no-argument startup.
      run: |
        (cd apps/hopdeck && cargo bundle --release)
        cp target/release/hopdeck-console \
           "target/release/bundle/osx/HopDeck.app/Contents/MacOS/"
    - name: Sign, notarize & package DMG
      env:
        # sign-and-notarize.sh consumes these; it no-ops to ad-hoc
        # signing when MACOS_CERTIFICATE_P12_BASE64 is unset, so the
        # build still succeeds without the secrets configured.
        MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
        MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
        MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        HOPDECK_SIGNING_PASSWORD: ${{ secrets.HOPDECK_SIGNING_PASSWORD }}
      run: |
        app="target/release/bundle/osx/HopDeck.app"
        dmg="target/release/bundle/osx/hopdeck-macos-arm64.dmg"
        scripts/sign-and-notarize.sh --app "$app"
        create-dmg \
          --volname "HopDeck" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 96 \
          --icon "HopDeck.app" 150 200 \
          --app-drop-link 450 200 \
          --no-internet-enable \
          "$dmg" "$app"
        scripts/sign-and-notarize.sh --dmg "$dmg"
    - name: Attach DMG to the release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.release.tag_name || inputs.tag }}
      run: gh release upload "$TAG" target/release/bundle/osx/hopdeck-macos-arm64.dmg --clobber --repo "$GITHUB_REPOSITORY"

  # Flatpak bundle build + upload now lives in release-flatpak.yml,
  # gated on the same `release: published` trigger. The split lets a
  # Flatpak failure run independently of the macOS signing chain,
  # and exposes a workflow_dispatch `ref` input so a manifest
  # change can be validated against HEAD without cutting a release.
