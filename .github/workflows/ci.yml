name: CI

# Per-PR safety net: fmt + clippy + test on every OS we ship to.
# Release-time builds live in release.yml; this is the pre-merge gate
# that keeps main green.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          - windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Scope rust-cache to the runner image
        # ImageVersion changes whenever GitHub refreshes the runner
        # image — which is also when preinstalled / Homebrew libs move.
        # Folding it into the cache key stops a cached build script's
        # baked-in `-L /opt/homebrew/Cellar/<lib>/<ver>/lib` from
        # outliving the Cellar dir it points at.
        shell: bash
        run: echo "CACHE_IMAGE=${ImageOS:-}-${ImageVersion:-}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.CACHE_IMAGE }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install libx11-dev libxtst-dev libdbus-1-dev
          sudo apt-get install libwayland-dev libxkbcommon-dev

      - name: Install macOS deps
        if: runner.os == 'macOS'
        run: brew install imagemagick

      - name: cargo clippy
        # Two invocations: gpui's ashpd `async-io` and the daemon's
        # ashpd `tokio` abort when feature-unified in one build graph.
        run: |
          cargo clippy --workspace --exclude hopdeck-console --all-targets --all-features -- -D warnings
          cargo clippy -p hopdeck-console --all-targets --all-features -- -D warnings

      - name: cargo test
        run: |
          cargo test --workspace --exclude hopdeck-console --all-features
          cargo test -p hopdeck-console --all-features
